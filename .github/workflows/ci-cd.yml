# Pipeline
#   PR to develop/main  -> test + build image (not pushed)
#   push to develop     -> test -> build & push sha-<commit> -> deploy Development
#   push to main        -> test -> build & push sha-<commit> -> deploy UAT
#                          -> (manual approval) -> deploy the SAME image to Production
name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'local/kind-food-app' }}

jobs:
  test:
    name: Test & validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Frontend - install
        run: npm ci

      - name: Frontend - unit tests
        run: npx react-scripts test --watchAll=false --passWithNoTests

      - name: Backend - install
        working-directory: server
        run: npm ci

      - name: Backend - generate Prisma client and validate schema
        working-directory: server
        run: npx prisma generate && npx prisma validate

      - name: Backend - typecheck and tests
        working-directory: server
        run: npm test

      - name: Backend - migrations apply cleanly to an empty database
        working-directory: server
        run: npx prisma migrate deploy

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Emulation so the runner (x86) can also build the ARM image for OCI Ampere A1.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Built ONCE per commit. Every environment deploys this exact image by its
      # immutable sha tag; the branch tag (develop/main) is just a convenience pointer.
      # Multi-arch: OCI Ampere A1 (arm64) and AMD/Intel shapes (amd64) both pull the same tag.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'main' || 'develop' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-development:
    name: Development
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  deploy-uat:
    name: UAT
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: uat
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit

  # Waits for a required reviewer on the "production" GitHub Environment.
  # Approve only after UAT sign-off of this same sha tag.
  deploy-production:
    name: Production
    needs: [build, deploy-uat]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.build.outputs.image_tag }}
    secrets: inherit
