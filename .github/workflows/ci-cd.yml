# Pipeline (a deploy runs only if test AND build of that same push succeeded)
#   PR to develop/uat/main -> test + build image (not pushed)
#   push to develop        -> test -> build & push sha-<commit>   (Development deploy disabled)
#   push to uat            -> test -> build & push sha-<commit> -> deploy UAT
#   push to main           -> test -> build & push sha-<commit> -> deploy Production

name: CI/CD

on:
  push:
    branches:
      - develop
      - uat
      - main

  pull_request:
    branches:
      - develop
      - uat
      - main

permissions:
  contents: read

# Prevent unnecessary concurrent deployments on the same branch.
concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.DOCKERHUB_IMAGE }}

jobs:

  # ==========================================
  # 1. TEST JOB
  # ==========================================

  test:
    name: Test & Validate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      # --------------------------------------
      # Frontend
      # --------------------------------------

      - name: Frontend - Install dependencies
        run: npm ci

      - name: Frontend - Run unit tests
        run: npx react-scripts test --watchAll=false --passWithNoTests

      # --------------------------------------
      # Backend
      # --------------------------------------

      - name: Backend - Install dependencies
        working-directory: server
        run: npm ci

      - name: Backend - Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Backend - Validate Prisma schema
        working-directory: server
        run: npx prisma validate

      # Apply migrations before tests if tests
      # require the database schema to exist.

      - name: Backend - Apply database migrations
        working-directory: server
        run: npx prisma migrate deploy

      - name: Backend - Run tests
        working-directory: server
        run: npm test


  # ==========================================
  # 2. BUILD AND PUSH DOCKER IMAGE
  # ==========================================

  build:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
      image: ${{ env.IMAGE }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      # Create immutable image tag using commit SHA.

      - name: Generate Docker image tag
        id: tag
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # --------------------------------------
      # Docker setup
      # --------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --------------------------------------
      # Docker Hub authentication
      # --------------------------------------

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # --------------------------------------
      # Build and push image
      # --------------------------------------

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64

          push: ${{ github.event_name == 'push' }}

          build-args: |
            GIT_SHA=${{ github.sha }}

          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.IMAGE }}:${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}

          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ==========================================
  # 3. DEVELOPMENT DEPLOYMENT
  # ==========================================

  # Uncomment this job when Development deployment is ready.

  # deploy-development:
  #   name: Deploy Development
  #   needs: build
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
  #   uses: ./.github/workflows/deploy.yml
  #   with:
  #     environment: development
  #     image_tag: ${{ needs.build.outputs.image_tag }}
  #   secrets: inherit


  # ==========================================
  # 4. UAT DEPLOYMENT
  # ==========================================

  deploy-uat:
    name: Deploy UAT
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/uat'

    uses: ./.github/workflows/deploy.yml

    with:
      environment: uat
      image_tag: ${{ needs.build.outputs.image_tag }}

    secrets: inherit


  # ==========================================
  # 5. PRODUCTION DEPLOYMENT
  # ==========================================

  deploy-production:
    name: Deploy Production
    needs: build

    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    uses: ./.github/workflows/deploy.yml

    with:
      environment: production
      image_tag: ${{ needs.build.outputs.image_tag }}

    secrets: inherit
