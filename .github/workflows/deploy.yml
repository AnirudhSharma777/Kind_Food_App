# Reusable deploy job, called by ci-cd.yml and rollback.yml.
# Copies docker-compose.yml, deploy.sh and the environment's .env to the server
# over SSH, then runs deploy.sh with the requested image tag.
#
# Per GitHub Environment (development / uat / production):
#   vars:    SSH_HOST, SSH_USER, SSH_PORT (optional), DEPLOY_PATH (optional), PUBLIC_URL
#   secrets: SSH_PRIVATE_KEY, SSH_KNOWN_HOSTS, APP_ENV_FILE
# Repository level:
#   vars:    DOCKERHUB_USERNAME, DOCKERHUB_IMAGE
#   secrets: DOCKERHUB_TOKEN (read/write, CI push), DOCKERHUB_PULL_TOKEN (read-only, servers)
name: Deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.PUBLIC_URL }}
    # Never run two deploys to the same environment at once.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/kindfood' }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]{1,128}$ ]] || { echo "Invalid image tag: $IMAGE_TAG"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]] || { echo "Invalid DEPLOY_PATH"; exit 1; }

      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      - name: Upload compose file, deploy script and environment config
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
        run: |
          umask 077
          { printf '%s\n' "$APP_ENV_FILE"; echo "DOCKERHUB_IMAGE=$DOCKERHUB_IMAGE"; } > env.upload
          ssh target "mkdir -p '$DEPLOY_PATH'"
          scp docker-compose.yml deploy/deploy.sh target:"$DEPLOY_PATH/"
          scp env.upload target:"$DEPLOY_PATH/.env"
          ssh target "chmod 600 '$DEPLOY_PATH/.env' && chmod 700 '$DEPLOY_PATH/deploy.sh'"
          rm -f env.upload

      - name: Log the server in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_PULL_TOKEN: ${{ secrets.DOCKERHUB_PULL_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_PULL_TOKEN" ]; then echo "No pull token set (public repo?) - skipping"; exit 0; fi
          printf '%s' "$DOCKERHUB_PULL_TOKEN" | ssh target "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Deploy (migrate, health-gated start, auto-rollback on failure)
        run: ssh target "'$DEPLOY_PATH/deploy.sh' '$IMAGE_TAG'"

      - name: Smoke test through the public URL
        if: env.PUBLIC_URL != ''
        run: |
          curl --fail --silent --show-error --max-time 10 \
               --retry 10 --retry-delay 6 --retry-all-errors \
               "$PUBLIC_URL/api/v1/health"
